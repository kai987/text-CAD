name: Publish house viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Check portable landmark regression baseline
        run: >-
          python -S -m unittest
          checks.test_tokyo_tower_detail.TokyoTowerDetailTests.test_r07_preserves_r06_geometry_outside_requested_appearance
          checks.test_tokyo_tower_detail.TokyoTowerDetailTests.test_preservation_fingerprint_tolerates_machine_tails_and_signed_zero
          checks.test_tokyo_tower_detail.TokyoTowerDetailTests.test_preservation_fingerprint_rejects_coordinate_and_metadata_changes
          -v
      - run: python -m pip install -r requirements.txt
      # Saved-artifact validation and the shared Python unit suite run together.
      - run: python src/cad_pipeline.py --validate
  build:
    needs: cad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

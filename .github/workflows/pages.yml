name: Publish house viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  cad-plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.catalog.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Read the authoritative validation catalog
        id: catalog
        run: >-
          PYTHONPATH=src python -S -c
          'import json; from cad_pipeline import VALIDATION_GROUPS; print("groups=" + json.dumps(VALIDATION_GROUPS))'
          >> "$GITHUB_OUTPUT"
  cad:
    needs: cad-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.cad-plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Check portable landmark regression baseline
        if: matrix.group == 'core'
        run: >-
          python -S -m unittest
          checks.test_tokyo_tower_detail.TokyoTowerDetailTests.test_r07_preserves_r06_geometry_outside_requested_appearance
          checks.test_tokyo_tower_r08.TokyoTowerR08Tests.test_only_explicit_framing_hosts_and_separate_fittings_can_change
          checks.test_tokyo_tower_r09.TokyoTowerR09Tests.test_only_the_exact_1528_frozen_lower_member_names_can_change
          checks.test_tokyo_tower_r10.TokyoTowerR10Tests.test_exact_material_replacement_has_52_legs_64_arches_and_no_duplicate_old_members
          checks.test_tokyo_tower_r10.TokyoTowerR10Tests.test_all_5221_retained_specs_only_change_explicit_alias_references
          checks.test_tokyo_tower_r11.TokyoTowerR11Tests.test_exact_120_old_grid_members_are_removed_and_all_5217_other_specs_stay_exact
          checks.test_tokyo_tower_detail.TokyoTowerDetailTests.test_preservation_fingerprint_tolerates_machine_tails_and_signed_zero
          checks.test_tokyo_tower_detail.TokyoTowerDetailTests.test_preservation_fingerprint_rejects_coordinate_and_metadata_changes
          -v
      - run: python -m pip install -r requirements.txt
      # These groups exactly partition the shared full local validation catalog.
      - run: python src/cad_pipeline.py --validate --validation-group ${{ matrix.group }}
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: [cad, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
